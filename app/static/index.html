<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>交易截图归档</title>
    <script>
      try {
        if (localStorage.getItem("future-record:theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch {
        // Keep the default dark theme when storage is unavailable.
      }
    </script>
    <link rel="stylesheet" href="/static/style.css?v=20260827-dark-theme" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="date-panel" aria-label="日期列表">
        <div class="panel-heading">
          <h1 id="accountTitle">交易截图</h1>
          <div class="panel-heading-actions">
            <button id="themeToggleBtn" class="icon-button" type="button" title="切换到浅色" aria-label="切换到浅色">☀</button>
            <button id="refreshBtn" class="icon-button" type="button" title="刷新" aria-label="刷新">↻</button>
          </div>
        </div>
        <nav class="account-nav" aria-label="账号切换">
          <a href="/huaan" data-account-link="huaan">华安期货</a>
          <a href="/shengda" data-account-link="shengda">盛达期货</a>
        </nav>
        <div id="dateList" class="date-list"></div>
      </aside>

      <section class="capture-panel" aria-label="截图保存">
        <div class="toolbar">
          <label>
            <span>交易日期</span>
            <input id="tradeDate" type="date" />
          </label>
          <label class="note-field">
            <span>备注</span>
            <input id="noteInput" type="text" maxlength="1000" placeholder="复盘重点、异常成交、当天状态" />
          </label>
          <button id="soundTestBtn" class="secondary-button" type="button">测试提示音</button>
          <button id="saveBtn" class="primary-button" type="button" disabled>保存截图</button>
        </div>

        <div id="pasteZone" class="paste-zone" tabindex="0">
          <div id="emptyPreview" class="empty-preview">
            <strong>Ctrl+V 粘贴截图</strong>
            <span>粘贴后确认预览，再保存到当前日期</span>
          </div>
          <img id="previewImage" class="preview-image" alt="待保存截图预览" hidden />
        </div>

        <div id="statusLine" class="status-line" role="status"></div>
      </section>

      <section class="records-panel" aria-label="记录浏览">
        <div class="records-header">
          <div>
            <h2 id="recordsTitle">当天记录</h2>
            <p id="recordsMeta">暂无记录</p>
          </div>
          <button id="clearPreviewBtn" class="secondary-button" type="button" disabled>清空预览</button>
        </div>
        <div id="recordsList" class="records-list"></div>
      </section>
    </main>

    <dialog id="viewerDialog" class="viewer-dialog">
      <div class="viewer-head">
        <div>
          <strong id="viewerTitle">截图</strong>
          <span id="viewerNote"></span>
        </div>
        <button id="closeViewerBtn" class="icon-button" type="button" title="关闭">×</button>
      </div>
      <img id="viewerImage" alt="交易截图大图" />
    </dialog>

    <dialog id="reminderDialog" class="reminder-dialog">
      <div class="reminder-body">
        <strong id="reminderTitle">交易截图提醒</strong>
        <p id="reminderText">今天还没有保存交易截图。</p>
        <div class="reminder-actions">
          <button id="reminderDismissBtn" class="secondary-button" type="button">今天不再提醒</button>
          <button id="reminderLaterBtn" class="secondary-button" type="button">稍后提醒</button>
          <button id="reminderGoBtn" class="primary-button" type="button">去保存</button>
        </div>
      </div>
    </dialog>

    <dialog id="noteDialog" class="note-dialog">
      <form id="noteForm" class="note-form" method="dialog">
        <label>
          <span id="noteDialogTitle">编辑备注</span>
          <textarea id="noteEditInput" maxlength="1000" rows="6"></textarea>
        </label>
        <div class="note-actions">
          <button id="noteCancelBtn" class="secondary-button" type="button">取消</button>
          <button id="noteSaveBtn" class="primary-button" type="submit">保存备注</button>
        </div>
      </form>
    </dialog>

    <script src="/static/app.js?v=20260827-dark-theme"></script>
  </body>
</html>
